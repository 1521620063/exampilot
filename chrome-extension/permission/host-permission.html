<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>授权 API 域名</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #213547;
        background: #f6f8fb;
      }
      body.embedded {
        min-height: 100vh;
        background: #fff;
      }
      main {
        width: min(360px, calc(100vw - 32px));
        padding: 22px;
        border: 1px solid #e4e7ec;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 28px rgba(33, 53, 71, 0.12);
      }
      body.embedded main {
        width: auto;
        max-width: 360px;
        border: none;
        box-shadow: none;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 700;
      }
      p {
        margin: 0 0 14px;
        color: #667085;
        font-size: 13px;
        line-height: 1.6;
      }
      code {
        display: block;
        margin: 10px 0 16px;
        padding: 9px 10px;
        border-radius: 6px;
        background: #f5f7fa;
        color: #344054;
        font-size: 12px;
        word-break: break-all;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 8px;
        background: #4f6ef7;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      #status {
        min-height: 18px;
        margin-top: 12px;
        font-size: 12px;
        color: #667085;
      }
      .error {
        color: #b42318;
      }
      .success {
        color: #027a48;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="permission-title">授权 API 域名</h1>
      <p id="permission-description">ExamPilot 需要获得下面这个 API 域名的访问权限，才能在扩展后台直接调用模型接口并绕过浏览器 CORS 限制。</p>
      <code id="origin">读取中...</code>
      <button id="authorize" type="button">授权访问该域名</button>
      <div id="status"></div>
    </main>
    <script src="host-permission.js"></script>
  </body>
</html>
